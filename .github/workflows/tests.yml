name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve VMT PayFast package
        run: composer update vmt/payfast --with-dependencies --no-interaction --no-scripts --no-install

      - name: Upload resolved Composer lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resolved-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1

      - name: Prepare SQLite
        run: |
          touch database/database.sqlite
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' .env

      - name: Setup Application
        run: composer setup

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit PHP dependencies
        run: composer audit --locked --no-dev

      - name: Run CI Checks
        run: composer ci:check
